services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: meeting
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meetingpass}
      POSTGRES_DB: meeting_notes
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeting -d meeting_notes"]
      interval: 5s
      retries: 10
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://meeting:${POSTGRES_PASSWORD:-meetingpass}@postgres:5432/meeting_notes?schema=public
      APP_PORT: 3001
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - audiodata:/app/server/uploads
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "0.0.0.0:8080:80"
    depends_on: [server]
volumes:
  pgdata:
  audiodata:
