server { listen 80; server_name _; root /usr/share/nginx/html; index index.html; location /api/ { proxy_pass http://server:3001/; proxy_set_header Authorization $http_authorization; client_max_body_size 260m; proxy_read_timeout 300s; } location /socket.io/ { proxy_pass http://server:3001/socket.io/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 3600s; } location / { try_files $uri $uri/ /index.html; } }